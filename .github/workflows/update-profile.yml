# Refreshes the generated parts of the profile README:
#   - stats.svg   live numbers + language chart (scripts/stats.py)
#   - snake SVGs  contribution-graph animation (Platane/snk)
# Output goes to the `output` branch so `main` stays clean.
name: Update profile

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile.yml"
      - "scripts/stats.py"
      - "assets/fonts/**"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Stats panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stats.py dist/stats.svg

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1f2937&color_dots=#ebedf0,#ffe4b8,#ffcb7a,#ffb454,#e8891a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffb454&color_dots=#161b22,#3a2d17,#6e4d1c,#b07a22,#ffb454

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
